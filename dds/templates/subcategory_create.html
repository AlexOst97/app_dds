{% extends 'dds/dds_base.html' %}
{% block content %}

<div class="container">
    <div class="row mt-5 justify-content-center">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}

                         <div class="mb-3">
                            <label class="form-label">Выберите категорию</label>
                            <select class="form-select" name="category" required>
                                <option value="">-- Выберите категорию --</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                         </div>

                        <div class="mb-3">
                            <label class="form-label">Название подкатегории</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание подкатегории</label>
                            <input type="text" class="form-control" name="description" required>
                        </div>

                        </div>
                    <div class="mb-3">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Создать
                    </button>
                    <div  >
                        <a class="mt-3 col-12 btn btn-secondary" href="{% url 'dds:subcategory-list' %}" role="button">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
