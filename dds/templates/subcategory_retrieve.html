{% extends 'dds/dds_base.html' %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row mt-5 justify-content-center">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">Номер id: {{ subcategory.id }}</p>
              <p class="card-text">Название категории: {{ subcategory.category }}</p>
              <p class="card-text">Название подкатегории: {{ subcategory.name }}</p>
               <p class="card-text">Описание подкатегории: {{ subcategory.description }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'dds:subcategory-list' %}" role="button">Назад</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'dds:subcategory-update' subcategory.pk %}" role="button">Редактировать</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'dds:subcategory-destroy' subcategory.pk %}" role="button">Удалить</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
