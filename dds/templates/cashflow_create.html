{% extends 'dds/dds_base.html' %}
{% block content %}

<div class="container">
    <div class="row mt-5 justify-content-center">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}

                         <div class="mb-3">
                            <label class="form-label">Выберите статус</label>
                            <select class="form-select" name="status" required>
                                <option value="">-- Выберите статус --</option>
                                {% for status in statuses %}
                                <option value="{{ status.id }}">{{ status.name }}</option>
                                {% endfor %}
                            </select>
                         </div>

                         <div class="mb-3">
                            <label class="form-label">Выберите тип</label>
                            <select class="form-select" name="type" required>
                                <option value="">-- Выберите тип --</option>
                                {% for type in types %}
                                <option value="{{ type.id }}">{{ type.name }}</option>
                                {% endfor %}
                            </select>
                         </div>

                         <div class="mb-3">
                            <label class="form-label">Выберите категорию</label>
                            <select class="form-select" name="category" required>
                                <option value="">-- Выберите категорию --</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                         </div>

                         <div class="mb-3">
                            <label class="form-label">Выберите подкатегорию</label>
                            <select class="form-select" name="subcategory" required>
                                <option value="">-- Выберите подкатегорию --</option>
                                {% for subcategory in subcategories %}
                                <option value="{{ subcategory.id }}">{{ subcategory.name }}</option>
                                {% endfor %}
                            </select>
                         </div>

                        <div class="mb-3">
                            <label class="form-label">Введите сумму</label>
                            <input type="text" class="form-control" name="sum" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Оставьте комментарий</label>
                            <input type="text" class="form-control" name="comment" required>
                        </div>

                    <div class="mb-3">
                    </div >
                    <button type="submit" class="mt-3 col-12 btn btn-primary">
                        Создать
                    </button>
                    <div  >
                        <a class="mt-3 col-12 btn btn-secondary" href="{% url 'dds:cashflow-list' %}" role="button">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
