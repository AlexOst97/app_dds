{% extends 'dds/dds_base.html' %}
{% block content %}

<div class="container">
    <div class="row mt-5 justify-content-center">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Вы действительно хотите изменить категорию: <b>{{ category.name }}</b> ?</label>
                            <input type="text" class="form-control" name="name" placeholder="Введите новое название категории" required>
                        </div>

                        <div class="mb-3">
                            <input type="text" class="form-control" name="description" placeholder="Введите новое описание категории" required>
                        </div>

                        </div>
                    <div class="mb-3">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Сохранить изменения
                    </button>
                    <div  >
                        <a class="mt-3 col-12 btn btn-secondary" href="{% url 'dds:category-list' %}" role="button">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
